name: Hentai Zone page index

# Scheduled workflows only run from the default branch, so this file also lives
# on main; the script itself always comes from hentai-zone-dev.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - hentai-zone-dev
    paths:
      - "tools/build_page_index.py"
      - ".github/workflows/page-index.yml"

permissions:
  contents: write

concurrency:
  group: page-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout index script
        uses: actions/checkout@v4
        with:
          ref: hentai-zone-dev

      - name: Count the pages of every post
        run: python3 tools/build_page_index.py "$RUNNER_TEMP/hentaizone-pages.json"

      - name: Publish to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/data" && cd "$RUNNER_TEMP/data"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin data; then
            git checkout -q -B data FETCH_HEAD
          else
            git checkout -q --orphan data
          fi
          cp "$RUNNER_TEMP/hentaizone-pages.json" .
          git add hentaizone-pages.json
          if git diff --cached --quiet; then
            echo "Index unchanged"
            exit 0
          fi
          git commit -q -m "Update Hentai Zone page index"
          git push -q origin HEAD:data
