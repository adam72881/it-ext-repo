name: Build and publish Hentai Zone

on:
  push:
    branches:
      - hentai-zone-dev
    paths:
      - "src/it/hentaizone/**"
      - ".github/workflows/build-hentai-zone.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hentai-zone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Checkout Keiyoushi build system
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: keiyoushi

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Add Hentai Zone module to Keiyoushi build
        run: |
          mkdir -p keiyoushi/src/it
          cp -R src/it/hentaizone keiyoushi/src/it/hentaizone

      - name: Format, build APK, and run release lint
        working-directory: keiyoushi
        run: ./gradlew --no-daemon :src:it:hentaizone:spotlessApply :src:it:hentaizone:assembleRelease :src:it:hentaizone:lintRelease --stacktrace

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: hentai-zone-build
          path: keiyoushi/src/it/hentaizone/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Checkout distribution branch
        uses: actions/checkout@v4
        with:
          ref: repo
          path: distribution
          persist-credentials: true

      - name: Publish APK and update extension indexes
        env:
          APK_SOURCE_DIR: keiyoushi/src/it/hentaizone/build/outputs/apk
        run: |
          set -euo pipefail
          APK="$(find "$APK_SOURCE_DIR" -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p distribution/apk
          APK_NAME="tachiyomi-it.hentaizone-v1.6.2.apk"
          cp "$APK" "distribution/apk/$APK_NAME"
          python3 - <<'PY'
          import gzip
          import json
          from pathlib import Path

          index_path = Path("distribution/index.min.json")
          entries = json.loads(index_path.read_text(encoding="utf-8")) if index_path.exists() else []
          pkg = "eu.kanade.tachiyomi.extension.it.hentaizone"
          entries = [entry for entry in entries if entry.get("pkg") != pkg]
          entries.append({
              "name": "Tachiyomi: Hentai Zone",
              "pkg": pkg,
              "apk": "tachiyomi-it.hentaizone-v1.6.2.apk",
              "lang": "it",
              "code": 106002,
              "version": "1.6.2",
              "nsfw": 1,
              "sources": [{
                  "name": "Hentai Zone",
                  "lang": "it",
                  "id": "7864123905182736401",
                  "baseUrl": "https://hentaizone.me",
                  "versionId": 1
              }]
          })
          entries.sort(key=lambda entry: (entry.get("lang", ""), entry.get("name", "")))
          index_bytes = (json.dumps(entries, ensure_ascii=False, separators=(",", ":")) + "\\n").encode("utf-8")
          index_path.write_bytes(index_bytes)
          Path("distribution/index.pb").write_bytes(gzip.compress(index_bytes, mtime=0))
          PY
          cd distribution
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/"$APK_NAME" index.min.json index.pb
          git commit -m "Publish Hentai Zone extension"
          git push origin repo
