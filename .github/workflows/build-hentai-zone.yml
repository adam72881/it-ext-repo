name: Build and publish Hentai Zone

on:
  push:
    branches:
      - hentai-zone-dev
      - claude/tachiyomi-extensions-repo-7ssu8l
    paths:
      - "src/it/hentaizone/**"
      - "tools/check_hentai_zone_site.py"
      - "tools/publish_extension.py"
      - ".github/workflows/build-hentai-zone.yml"
      - ".github/workflows/build-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

# Shared with the Hentai ITA workflow so two publishes never race on the repo branch.
concurrency:
  group: extension-builds
  cancel-in-progress: false

jobs:
  hentai-zone:
    uses: ./.github/workflows/build-extension.yml
    with:
      module: hentaizone
      preflight: check_hentai_zone_site.py
      publish: ${{ github.ref == 'refs/heads/hentai-zone-dev' }}
    secrets: inherit
